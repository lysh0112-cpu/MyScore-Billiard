<style>
  :root{
    --bg:#0B1219; --panel:#0F1A22; --card:#16232E; --row:#131F29;

    --line:rgba(255,255,255,.16);      /* 바깥 테두리 · 큰 구획 */
    --line2:rgba(255,255,255,.14);     /* 표 안 줄 */
    --line3:rgba(255,255,255,.10);     /* 카드 안쪽 — 은은하게 */
    --ivory:#F4EEDF; --chalk:#7E9AB0; --dim:#5B7186; --gold:#E8B838;
    --green:#4FB286; --red:#F09595;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ivory);
    font-family:'IBM Plex Sans KR',-apple-system,system-ui,'Malgun Gothic',sans-serif;font-size:14px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px;}
  input,select,textarea{font-family:inherit;font-size:13.5px;width:100%;
    background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.16);border-radius:8px;
    padding:10px 13px;color:var(--ivory);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(232,184,56,.55);}
  input::placeholder{color:var(--dim);}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .top{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;}
  .tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--line);}
  .tab{padding:9px 16px;font-size:13.5px;color:var(--chalk);border-radius:8px 8px 0 0;}
  .tab.on{background:var(--gold);color:#141200;font-weight:700;}
  .tab .n{opacity:.7;font-size:12px;margin-left:3px;}
  .body{padding:16px 18px;}
  .sum{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
  .box{flex:1;min-width:170px;background:var(--card);border:1px solid var(--line3);
       border-radius:10px;padding:13px 15px;}
  .box .k{font-size:11px;color:var(--chalk);letter-spacing:.04em;}
  .box .v{font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums;}
  .box .u{font-size:12px;color:var(--chalk);margin-left:2px;}
  .warn{background:#241E12;border-color:rgba(232,184,56,.45);}
  .warn .k,.warn .v{color:var(--gold);}
  .bar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
  .prim{background:var(--gold);color:#141200;border-radius:8px;padding:10px 16px;font-weight:700;font-size:13px;}
  .ghost{border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:10px 14px;
         color:#B9CCDA;font-size:12.5px;}
  .ghost.on{border-color:var(--gold);color:var(--gold);}
  .tbox{border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;background:var(--row);}
  th{font-size:11px;color:var(--chalk);text-align:left;font-weight:600;letter-spacing:.04em;
     padding:11px 16px;background:var(--card);
     border-bottom:1px solid var(--line2);white-space:nowrap;}
  td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top;font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:rgba(255,255,255,.03);}
  .r{text-align:right;}
  .sub{font-size:11.5px;color:var(--dim);margin-top:3px;}
  .num{font-variant-numeric:tabular-nums;}
  .gold{color:var(--gold);} .green{color:var(--green);} .red{color:var(--red);}
  .link{font-size:11.5px;color:var(--chalk);text-decoration:underline;}
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;
        align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{width:100%;max-width:460px;max-height:92vh;overflow-y:auto;

  .mid{max-width:420px;margin:70px auto;text-align:center;}

}
