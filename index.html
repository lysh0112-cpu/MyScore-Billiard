        ❙❙ 로 멈춰도 다시 안 풀립니다 — 판이 시작된 사실은 그대로이기 때문입니다 */
  const [begun, setBegun] = useState(false);
  useEffect(() => {
    setBare(!endAsk && !goAsk && !timeAsk && phase === "board");
  }, [phase, endAsk, goAsk, timeAsk]); // eslint-disable-line
  useEffect(() => {
    if (!running || phase !== "board") return;
    const t = setInterval(() => {
      setElapsed(e => e + 1);
      if (useClock) setShot(s => s > 0 ? s - 1 : 0);
    }, 1000);
    return () => clearInterval(t);
  }, [running, phase, useClock]);
  /* ★ 샷 클락 — 10초 · 5초 남았을 때 소리로 알리고, 다 되면 진동.
     당구대에서 폰을 안 보고 치므로 눈으로 보는 숫자만으로는 늦는다.
     정해 둔 시간이 그보다 짧으면(예: 5초) 그 안내는 건너뛴다.
     음성 안내를 꺼 두면 말은 안 하고 진동만 한다 */
  useEffect(() => {
    if (!useClock || !running) return;
    if (shot === 10 && clockSec > 10) say2("10초");else if (shot === 5 && clockSec > 5) {
      say2("5초");
      try {
        navigator.vibrate?.(120);
      } catch (e) {}
    } else if (shot === 0) {
      say2("시간 초과");
      try {
        navigator.vibrate?.(400);
      } catch (e) {}
    }
  }, [shot]); // eslint-disable-line

  /* ★ 정해 둔 경기 시간이 다 되면 알린다.
     ⚠ 2026-09-11 — 전에는 ★«말만» 했다. 당구대에서 폰을 안 보고 치시니
       그 한마디가 그냥 지나갔고, 무승부 창은 [종료] 를 «손으로 눌러야» 나왔다.
       ⇒ 대표님이 「작동이 안 된다」고 하신 것이 이것이다. 이제 ★창을 띄운다.
     ⛔ 판을 저절로 끝내지는 않는다 — 묻고, 고르시는 대로 한다 */
  useEffect(() => {
    if (!limitMin || !running) return;
    if (elapsed < limitMin * 60 || overSaid) return;
    setOverSaid(true);
    try {
      navigator.vibrate?.([300, 150, 300]);
    } catch (e) {}
    say2(`${limitMin}분이 다 됐습니다`);
    /* ★ 누군가 이미 목표에 닿아 있으면 무승부가 아니다 — 승부가 난 것이다 */
    if (units.some(p => Number(p.handi) > 0 && sc(p.key) >= Number(p.handi))) return;
    /* 목표에 닿았을 때와 같게 — 묻는 동안 시계를 멈춘다 */
    setRunning(false);
    wakeOff();
    setTimeAsk(true);
  }, [elapsed, limitMin, running]); // eslint-disable-line
  const wakeOn = async () => {
    try {
      wake.current = await navigator.wakeLock?.request("screen");
    } catch (e) {}
  };
  const wakeOff = () => {
    try {
      wake.current?.release();
    } catch (e) {}
    wake.current = null;
  };
  useEffect(() => {
    wakeOn();
    return wakeOff;
  }, []); // eslint-disable-line

  const units = team ? sides.map((idxs, i) => {
    const mem = idxs.map(j => ps[j]).filter(Boolean);
    return {
      key: "T" + i,
      name: mem.map(m => m.name).join(" · ") || `${i + 1}편`,
      handi: mem.reduce((t, m) => t + (Number(m.handi) || 0), 0),
      c: mem[0]?.c ?? i,
      members: mem
    };
  }) : ps.map(p => ({
    ...p,
    members: [p]
  }));

  /* 지난 기록에 나온 이름과 그때 핸디 — 선수 창에서 고를 후보 */
  const pastNames = useMemo(() => knownNames(data.games).slice(0, 12).map(n => ({
    name: n,
    handi: lastHandiOf(data.games, n, mode) || 0
  })), [data.games, mode]);

  /* ★ 복식에서 소리로 부르는 이름 — 편이 아니라 사람 (사용자 지시).
        점수·이닝·기록은 그대로 편끼리 센다 (7판 6-3). 바뀌는 것은 부르는 말뿐이다.
        차례가 도는 규칙이 정해져 있으므로 차례 번호 하나로 사람이 정해진다:
          0번째 1편 앞사람 · 1번째 2편 앞사람 · 2번째 1편 뒷사람 · 3번째 2편 뒷사람 …
        편 안에서 누가 앞사람인지는 [편 짜기] 의 ▲▼ 로 정한다.
     ⚠ 화면은 안 건드린다 — 점수 글씨가 작아지면 안 된다 (사용자 지시) */
  const callName = (i, tn) => {
    const u = units[i];
    if (!u) return "";
    const mem = u.members || [];
    if (!team || mem.length < 2) return u.name;
    const times = Math.floor(Math.max(0, tn) / units.length); /* 그 편이 몇 번째로 치는가 */
    return mem[times % mem.length]?.name || u.name;
  };

  /* ★ 판이 끝날 때 소리로 알린다 (사용자 지시).
        "1게임째 종료" 같은 숫자말 대신 사람이 부르는 말로 한다.
        첫 판 · 두 번째 판 … 일곱 번째 판 */
  const NTH = ["", "첫", "두 번째", "세 번째", "네 번째", "다섯 번째", "여섯 번째", "일곱 번째", "여덟 번째", "아홉 번째", "열 번째"];
  const nthOf = (n, last) => `${NTH[n] || `${n}번째`} ${last ? "마지막 " : ""}판`;
  const STEP = mode === "4" ? 10 : 1;
  /* ★ 수구 색은 "몇 번째 차례인가" 로만 정한다 (7판 · 사용자 지시).
        초구 색을 고르면(firstBall) 그다음은 무조건 나머지 한 색이다.
        공은 흰공·노란공 두 가지뿐이므로 계속 번갈아 간다.
      ⚠ 전에는 자리 번호(i)를 함께 더했다. 세 명일 때 자리와 차례가 서로 상쇄돼
        흰·흰·흰 처럼 같은 색이 세 번 이어졌다 (사용자 지적).
        두 명·네 명일 때는 우연히 맞아서 안 드러났다.
      turn(i) — 그 자리 사람이 몇 번째로 치는가.
        지금 칠 사람(active)이 turnNo 번째이고, 뒤로 갈수록 한 번씩 늘어난다.
     ★ 아직 차례가 안 온 사람도 자기가 받을 색을 미리 보여준다 (사용자 확인). */
  const ballOf = i => {
    if (!autoBall) return units[i]?.c ?? i;
    const n = units.length || 1;
    const turn = turnNo + (i - active + n) % n;
    return (firstBall + turn) % 2;
  };
  const say2 = t => {
    if (voice) speakKo(t);
  };
  const sc = k => score[k] || 0;
  const tn = k => turns[k] || 0;
  const snap = () => setHist(x => [...x.slice(-60), {
    score: {
      ...score
    },
    turns: {
      ...turns
    },
    high: {
      ...high
    },
    run,
    active
  }]);
  const undo = () => {
    const l = hist[hist.length - 1];
    if (!l) return;
    setScore(l.score);
    setTurns(l.turns);
    setHigh(l.high);
    setRun(l.run);
    setActive(l.active);
    setHist(h => h.slice(0, -1));
  };
  const addPt = d => {
    const p = units[active],
      k = p.key;
    if (!running) setRunning(true);
    setBegun(true);
    if (!startAt) setStartAt(Date.now());
    snap();
    const now = Math.max(0, sc(k) + d);
    setScore(s => ({
      ...s,
      [k]: now
    }));
    setRun(r => Math.max(0, r + d));
    setShot(clockSec);
    const goal = Number(p.handi) || 0;
    const left = goal - now;
    if (goal > 0 && now >= goal) {
      setFinishOrder(o => o.includes(k) ? o : [...o, k]);
    }
    const near = STEP * 3;
    if (d < 0) say2(`마이너스 ${-d}점`);else if (goal > 0 && left <= 0) {
      // 3인 이상이면 꼴찌 한 명 남을 때까지 계속
      const already = finishOrder.filter(x => x !== k).length;
      const doneCnt = already + 1;
      const remain = units.length - doneCnt;
      if (units.length <= 2 || remain <= 1) {
        /* ★ 단판은 이 순간이 곧 경기의 끝이다. "목표 도달" 만으로는 끝난 줄 모른다 (사용자 지적).
              여러 판이면 곧이어 "첫 판 종료, OO 승" 이 나오므로 여기서는 짧게 둔다 */
        if (bestOf === 1 && autoEnd) {
          /* ★ 목표를 넘겨 한 점 더 쳐도 같은 말을 또 하지 않는다 */
          if (endSaid.current) say2(`${d}점`);else {
            say2(`${d}점, ${p.name} 승, 경기가 종료되었습니다`);
            endSaid.current = true;
          }
        } else say2(`${d}점, 목표 도달`);
      } else {
        say2(`${d}점, ${doneCnt}위 도달, ${remain}명 계속 진행`);
      }
    } else if (goal > 0 && left <= near) say2(`${d}점, ${left}점 남았습니다`);else say2(`${d}점`);
  };
  /* ★ 목표에 닿은 사람은 «없는 것으로» 본다 (2026-09-11 · 대표님).
        3명 이상은 1등이 나와도 나머지가 끝까지 친다. 그런데 끝난 사람 차례가
        그대로 돌아와서 「없는 사람을 기다리는」 모양이 됐다.
     ⛔ 건너뛴 사람은 차례도 «안 세고» 이닝도 «안 올린다» — 안 쳤으니까.
        그래야 공 색이 어긋나지 않는다 (색은 몇 번째 차례인지로 정해진다).
     ⚠ 두 자리(단식·복식)는 건너뛰지 않는다 — 목표에 닿으면 판이 끝난다 */
  const isDone = i => {
    if (!multiSeat) return false;
    const p = units[i];
    return Number(p.handi) > 0 && sc(p.key) >= Number(p.handi);
  };
  /* 아직 치고 계신 분 중 다음 차례. 아무도 없으면 지금 자리를 그대로 둔다 */
  const nextAlive = from => {
    for (let d = 1; d <= units.length; d++) {
      const j = (from + d) % units.length;
      if (!isDone(j)) return j;
    }
    return from;
  };
  const hit = i => {
    /* ★ 끝난 사람을 누르면 점수가 오르지 않는다. 대신 왜 그런지 말해준다 */
    if (isDone(i) && i !== active) {
      setDoneMsg(`${units[i].name}님은 목표에 닿았습니다`);
      setTimeout(() => setDoneMsg(""), 1600);
      return;
    }
    if (i !== active) {
      // 점수판을 눌러 차례를 넘길 때도 이닝과 수구 교대를 그대로 적용
      const k = units[active].key;
      snap();
      if (!running) setRunning(true);
      if (!startAt) setStartAt(Date.now());
      setHigh(h => ({
        ...h,
        [k]: Math.max(h[k] || 0, run)
      }));
      const span = (i - active + units.length) % units.length;
      /* ★ 사이에 끼어 있는 «끝난 사람» 은 차례로 세지 않는다 — 안 쳤다 */
      const passed = [];
      for (let d = 0; d < span; d++) {
        const j = (active + d) % units.length;
        if (!isDone(j) || j === active) passed.push(units[j].key);
      }
      const steps = passed.length;
      setTurns(t => {
        const n = {
          ...t
        };
        passed.forEach(kk => {
          n[kk] = (n[kk] || 0) + 1;
        });
        return n;
      });
      setRun(0);
      setActive(i);
      setShot(clockSec);
      setTurnNo(t => t + steps);
      if (autoBall) {
        /* ★ 화면(ballOf)과 같은 식 — 몇 번째 차례인지만 본다.
              자리 번호를 더하면 안 된다 (세 명일 때 색이 안 바뀐다) */
        const b = (firstBall + turnNo + steps) % 2;
        say2(`${callName(i, turnNo + steps)} 차례, ${BALLNAME[b]}`);
      } else {
        say2(`${callName(i, turnNo + steps)} 차례`);
      }
      return;
    }
    addPt(STEP);
  };
  const minus = (d = 1) => addPt(-d);
  const next = () => {
    const k = units[active].key;
    snap();
    if (!running) setRunning(true);
    if (!startAt) setStartAt(Date.now());
    setHigh(h => ({
      ...h,
      [k]: Math.max(h[k] || 0, run)
    }));
    setTurns(t => ({
      ...t,
      [k]: (t[k] || 0) + 1
    }));
    setRun(0);
    /* ★ 끝난 사람은 건너뛴다. 차례 수는 «한 번만» 는다 — 건너뛴 사람은 안 쳤다 */
    const nx = nextAlive(active);
    setActive(nx);
    setShot(clockSec);
    setTurnNo(t => t + 1);
    if (autoBall) {
      /* ★ 화면(ballOf)과 같은 식 — 다음 차례는 지금보다 하나 뒤다 */
      const b = (firstBall + turnNo + 1) % 2;
      say2(`${callName(nx, turnNo + 1)} 차례, ${BALLNAME[b]}`);
    } else {
      say2(`${callName(nx, turnNo + 1)} 차례`);
    }
  };
  const reset = () => {
    if (!confirm("점수를 모두 지우고 새로 시작할까요?")) return;
    setScore({});
    setTurns({});
    setHigh({});
    setRun(0);
    setActive(0);
    setTurnNo(0);
    setFinishOrder([]);
    setStartAt(null);
    setElapsed(0);
    setShot(clockSec);
    setHist([]);
    setRunning(false);
    setBegun(false);
    endSaid.current = false;
  };
  /* ★ go — 이 판을 저장한 뒤 어디로 갈지
        "next"   바로 다음 판으로 (결과 화면을 안 거친다)
        "done"   결과 화면으로 (기본)
     ★ stop — 시리즈가 안 끝났어도 여기서 경기를 끝낸다
        bestOf 를 1로 바꾸지 않는다. "5전 3선승제였는데 2판까지 치고 끝냄" 으로 남긴다 */
  /* ★ bo — 판 수를 «늘리면서» 끝낼 때 쓴다. setBestOf 는 곧바로 반영되지 않아
        여기서 옛 값을 보고 「이번 판으로 끝」 이라 잘못 셈하기 때문이다 */
  const finish = (go, stop, bo) => {
    const bestOf = bo || bestOfNow;
    const k = units[active].key;
    const hi = {
      ...high,
      [k]: Math.max(high[k] || 0, run)
    };
    const tu = {
      ...turns,
      [k]: Math.max(1, turns[k] || 0)
    };
    /* ★ 8판 — 여기도 units 다. 편으로 칠 때 사람 열쇠를 넣으면
          turns 에 쓰지도 않는 값이 섞이고, 아래 teams 의 inn 과도 어긋난다 */
    units.forEach(u => {
      if (!tu[u.key]) tu[u.key] = 1;
    });
    setHigh(hi);
    setTurns(tu);
    const rank = [...units].sort((a, b) => {
      const ia = finishOrder.indexOf(a.key),
        ib = finishOrder.indexOf(b.key);
      if (ia !== ib) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      const ra = Number(a.handi) > 0 ? sc(a.key) / Number(a.handi) : 0;
      const rb = Number(b.handi) > 0 ? sc(b.key) / Number(b.handi) : 0;
      return rb - ra;
    });
    /* ★ 시간을 정해 두고 치는 방식(3~4인 개인전)에서는
       아무도 목표 점수에 닿지 못한 채 끝나는 판이 있다. 그때는 무승부다.
       전에는 점수가 앞선 사람을 억지로 1위로 올렸다. */
    const drew = finishOrder.length === 0;
    const w = drew ? "" : rank[0].key;
    setWinner(w);
    setLog(L => [...L, {
      no: gameNo,
      seconds: elapsed,
      winnerKey: w,
      drew,
      startAt: startAt || Date.now() - elapsed * 1000,
      endAt: Date.now(),
      order: rank.map(u => u.key),
      teams: units.map(u => ({
        key: u.key,
        name: u.name,
        handicap: Number(u.handi) || 0,
        c: u.c,
        score: sc(u.key),
        inn: tu[u.key] || 1,
        high: hi[u.key] || 0,
        members: u.members.map(m => ({
          key: m.key,
          memberId: m.memberId,
          name: m.name
        }))
      }))
    }]);
    setWins(x => {
      const n = {
        ...x
      };
      rank.forEach((u, i) => {
        if (!n[u.key]) n[u.key] = 0;
        if (!drew && i === 0) n[u.key] += 1; // 1위 횟수 · 무승부는 안 센다
      });
      return n;
    });
    setPts(x => {
      const n = {
        ...x
      };
      /* 무승부면 모두 같은 점수를 준다. 순서를 매기면 안 된다 */
      const evenPt = Math.round((units.length + 1) / 2);
      rank.forEach((u, i) => {
        n[u.key] = (n[u.key] || 0) + (drew ? evenPt : units.length - i);
      });
      return n;
    });
    setRunning(false);
    wakeOff();
    if (stop) setStopped(true);

    /* ★ 판이 끝났을 때 부르는 말 (사용자가 정함)
          1판  "첫 판 종료, 이인승 승"
          2판  "두 번째 판 종료, 김성곤 승"
          끝판  "세 번째 마지막 판 종료, 김성곤 승, 최종 김성곤 게임 승리했습니다"
       ⚠ 여기서는 wins·pts 가 아직 안 바뀌었다 (바로 위에서 setWins 를 불렀을 뿐이다).
         그래서 마지막 승자는 이 판 결과까지 얹어 직접 센다 */
    const last = stop || gameNo >= bestOf || !multiSeat && Object.keys(wins).some(k => (wins[k] || 0) + (!drew && rank[0]?.key === k ? 1 : 0) >= need);
    const head = bestOf > 1 ? `${nthOf(gameNo, last)} 종료` : "경기 종료";
    const win = `${rank[0]?.name || ""} 승`;

    /* ★ 무승부는 소리로 알리지 않는다 (사용자 지시).
          화면에는 그대로 "무승부" 로 나온다 — 소리만 안 낸다.
          다만 마지막 판이 무승부라도 경기 전체 승자는 있을 수 있으므로
